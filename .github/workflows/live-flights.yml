name: Live Flights Data

on:
  schedule:
    # Every 30 minutes at the half-hour — modest, compliance-friendly cadence.
    # OpenSky free tier is ~400 credits/day; ~48 requests/day stays well under.
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Read the current live-data branch state so we can honor backoff + preserve old data.
      - name: Check out live-data branch
        run: |
          git fetch origin live-data 2>/dev/null || true
          if git rev-parse --verify origin/live-data >/dev/null 2>&1; then
            git checkout -B work origin/live-data
            echo "checked out existing live-data branch"
          else
            git checkout --orphan work
            git rm -r --cached . -q 2>/dev/null || true
            echo "created orphan work branch"
          fi

      - name: Get date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache aircraft database (90MB, refreshed daily)
        id: db-cache
        uses: actions/cache@v4
        with:
          path: /tmp/aircraftDatabase.csv
          key: opensky-db-${{ steps.date.outputs.date }}

      - name: Download aircraft database (only on cache miss)
        if: steps.db-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL --max-time 240 \
            -H "User-Agent: aviationpedia-live-data/0.1" \
            "https://opensky-network.org/datasets/metadata/aircraftDatabase.csv" \
            -o /tmp/aircraftDatabase.csv
          echo "db size: $(wc -c < /tmp/aircraftDatabase.csv) bytes"

      # Fetch + compact + stateful backoff. On failure this only writes state.json,
      # leaving the previous good data/flights.json intact for the front-end.
      - name: Fetch and compact (stateful backoff)
        id: fetch
        run: |
          mkdir -p /tmp/live
          cp -f data/flights.json /tmp/live/flights.json 2>/dev/null || true
          cp -f data/lookup.json /tmp/live/lookup.json 2>/dev/null || true
          cp -f data/state.json /tmp/live/state.json 2>/dev/null || true
          node --experimental-strip-types e2e/fetch-live.mjs opensky \
            /tmp/live/raw.json /tmp/live/flights.json \
            /tmp/aircraftDatabase.csv /tmp/live/state.json /tmp/live/state.json /tmp/live/lookup.json
          echo "FETCH_OK=$?" >> "$GITHUB_OUTPUT"

      # Push: always publish state.json (so backoff persists) and, when a fetch
      # succeeded, the fresh flights.json + lookup.json.
      - name: Push to live-data branch (force, single commit)
        run: |
          git config user.name "Aviationpedia Bot"
          git config user.email "bot@aviationpedia.local"
          mkdir -p data
          cp -f /tmp/live/state.json data/state.json 2>/dev/null || true
          cp -f /tmp/live/flights.json data/flights.json 2>/dev/null || true
          cp -f /tmp/live/lookup.json data/lookup.json 2>/dev/null || true
          git add -f data/state.json data/flights.json data/lookup.json
          git commit -m "live flight data $(date -u +%Y-%m-%dT%H:%M:%SZ) [${FETCH_OK-failed}]" || echo "nothing to commit"
          git branch -M live-data
          git push origin live-data --force
